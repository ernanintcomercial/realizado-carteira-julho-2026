<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Realizado x Carteira — Julho 2026</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e6eaf0;--blue:#2563eb;--amber:#f59e0b;--green:#059669;--red:#dc2626}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}
    main{max-width:1180px;margin:auto;padding:28px 18px 48px}
    header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}
    h1{font-size:25px;letter-spacing:-.5px;margin:0 0 4px}.subtitle{color:var(--muted)}
    .stamp{text-align:right;color:var(--muted);font-size:12px}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px #1018280a}
    .kpi{padding:18px}.kpi span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
    .kpi strong{display:block;font-size:25px;margin-top:6px}.blue{color:var(--blue)}.amber{color:var(--amber)}.green{color:var(--green)}
    .contracts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
    .contract{padding:16px;cursor:pointer;transition:.15s;border:2px solid transparent}.contract:hover,.contract.active{border-color:var(--blue);transform:translateY(-1px)}
    .contract h2{font-size:14px;margin:0 0 12px}.metric{display:flex;justify-content:space-between;margin-top:7px}.metric span{color:var(--muted)}
    .panel{padding:20px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .panel h2{font-size:16px;margin:0}.legend{display:flex;gap:14px;color:var(--muted);font-size:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
    #chart{width:100%;height:330px;display:block}.grid{stroke:#e8edf4;stroke-width:1}.axis{fill:#667085;font-size:11px}.sales{fill:none;stroke:var(--blue);stroke-width:3}.wallet{fill:none;stroke:var(--amber);stroke-width:3}
    .warning{display:none;padding:12px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;margin-bottom:14px}
    .warning.show{display:block}
    .table-wrap{overflow:auto;max-height:410px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#172033;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    footer{color:var(--muted);font-size:12px;margin-top:16px}
    @media(max-width:800px){header{align-items:start;flex-direction:column}.stamp{text-align:left}.kpis{grid-template-columns:1fr}.contracts{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){main{padding:20px 10px}.contracts{grid-template-columns:1fr}.kpi strong{font-size:22px}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Realizado x Carteira</h1><div class="subtitle">Julho de 2026 · acumulado diário por contrato</div></div>
    <div class="stamp" id="stamp">Carregando…</div>
  </header>

  <section class="kpis">
    <article class="card kpi"><span>Realizado acumulado</span><strong class="blue" id="totalReal">—</strong></article>
    <article class="card kpi"><span>Carteira acumulada</span><strong class="amber" id="totalCarteira">—</strong></article>
    <article class="card kpi"><span>Potencial comercial</span><strong class="green" id="totalPotencial">—</strong></article>
  </section>

  <div class="warning" id="warning"></div>
  <section class="contracts" id="contracts"></section>

  <section class="card panel">
    <div class="panel-head">
      <h2 id="chartTitle">Evolução acumulada</h2>
      <div class="legend"><span><i class="dot" style="background:#2563eb"></i>Realizado</span><span><i class="dot" style="background:#f59e0b"></i>Carteira</span></div>
    </div>
    <svg id="chart" viewBox="0 0 1000 330" preserveAspectRatio="none" aria-label="Gráfico acumulado diário"></svg>
  </section>

  <section class="card panel">
    <div class="panel-head"><h2>Detalhe diário</h2><span class="subtitle" id="tableTitle"></span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Realizado acumulado</th><th>Carteira acumulada</th><th>Potencial</th></tr></thead>
        <tbody id="dailyRows"></tbody>
      </table>
    </div>
  </section>

  <footer id="sources"></footer>
</main>
<script>
const money=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const day=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace('ç','c');
let data,selected='ALUMÍNIO';

function draw(contract){
  selected=contract;
  document.querySelectorAll('.contract').forEach(x=>x.classList.toggle('active',x.dataset.contract===contract));
  const key=slug(contract), rows=data.serieDiaria.map(x=>({date:x.data,real:x[key+'_realizado'],wallet:x[key+'_carteira']}));
  const svg=document.getElementById('chart'), W=1000,H=330,p={l:75,r:25,t:20,b:38};
  const max=Math.max(1,...rows.flatMap(x=>[x.real,x.wallet]))*1.08;
  const x=i=>p.l+i*(W-p.l-p.r)/(rows.length-1), y=v=>H-p.b-v*(H-p.t-p.b)/max;
  const path=k=>rows.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(r[k]).toFixed(1)).join(' ');
  let html='';
  for(let i=0;i<=4;i++){const val=max*i/4,yy=y(val);html+=`<line class="grid" x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}"/><text class="axis" x="${p.l-10}" y="${yy+4}" text-anchor="end">${money(val).replace('R$ ','')}</text>`}
  [0,7,14,21,30].forEach(i=>html+=`<text class="axis" x="${x(i)}" y="${H-12}" text-anchor="middle">${day(rows[i].date)}</text>`);
  html+=`<path class="sales" d="${path('real')}"/><path class="wallet" d="${path('wallet')}"/>`;
  svg.innerHTML=html;
  document.getElementById('chartTitle').textContent=`Evolução acumulada · ${contract}`;
  document.getElementById('tableTitle').textContent=contract;
  document.getElementById('dailyRows').innerHTML=rows.map(r=>`<tr><td>${day(r.date)}</td><td>${money(r.real)}</td><td>${money(r.wallet)}</td><td>${money(r.real+r.wallet)}</td></tr>`).join('');
}

fetch('dados-julho.json').then(r=>r.json()).then(payload=>{
  data=payload;
  totalReal.textContent=money(data.totais.realizado); totalCarteira.textContent=money(data.totais.carteira); totalPotencial.textContent=money(data.totais.potencial);
  stamp.innerHTML=`Dados até <strong>${day(data.periodo.fim)}</strong><br>Gerado em ${data.geradoEm}`;
  contracts.innerHTML=data.contratos.map(c=>`<article class="card contract" data-contract="${c.contrato}"><h2>${c.contrato}</h2><div class="metric"><span>Realizado</span><b>${money(c.realizado)}</b></div><div class="metric"><span>Carteira</span><b>${money(c.carteira)}</b></div><div class="metric"><span>Potencial</span><b>${money(c.potencial)}</b></div></article>`).join('');
  contracts.querySelectorAll('.contract').forEach(x=>x.onclick=()=>draw(x.dataset.contract));
  if(data.verificacoes.status!=='OK'){warning.classList.add('show');warning.textContent=`Conciliação: total realizado fecha com WWWPD010. R$ ${data.verificacoes.valorReclassificadoEntreContratos.toLocaleString('pt-BR',{minimumFractionDigits:2})} aparece classificado entre Plástico e Alumínio de forma diferente nas duas fontes. Representante fora do INDEX: ${data.verificacoes.representantesForaINDEX.join(', ')}.`}
  sources.textContent='Fontes: '+data.fontes.join(' · ');
  draw(selected);
}).catch(()=>{stamp.textContent='Erro ao carregar dados-julho.json'});
</script>
</body>
</html>
